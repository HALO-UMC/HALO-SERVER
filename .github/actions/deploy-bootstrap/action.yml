name: 배포 부트스트랩
description: Tailscale 접속, SSH 설정, compose/nginx/.env 설정 백업 및 compose/nginx/배포 스크립트 서버 전송까지 prod 배포 준비 단계. 호출 전에 actions/checkout이 먼저 실행되어 있어야 함.

inputs:
  firebase-service-account-b64:
    required: true
  tailscale-oauth-client-id:
    required: true
  tailscale-oauth-secret:
    required: true
  ec2-known-hosts:
    required: true
  ec2-ssh-key:
    required: true
  ec2-username:
    required: true
  ec2-host:
    required: true
    description: 서버의 Tailscale 주소 (MagicDNS 이름 또는 100.x IP)
  ec2-app-dir:
    required: true

runs:
  using: composite
  steps:
    - name: Firebase 시크릿 유효성 사전검증
      shell: bash
      env:
        FIREBASE_SERVICE_ACCOUNT_B64: ${{ inputs.firebase-service-account-b64 }}
      run: |
        if [ -z "$FIREBASE_SERVICE_ACCOUNT_B64" ]; then
          echo "FIREBASE_SERVICE_ACCOUNT_B64 시크릿이 비어 있습니다." >&2
          exit 1
        fi
        if ! DECODED=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d 2>/dev/null); then
          echo "FIREBASE_SERVICE_ACCOUNT_B64가 유효한 base64 값이 아닙니다." >&2
          exit 1
        fi
        if ! printf '%s' "$DECODED" | jq -e '.private_key != null and .private_key != ""' > /dev/null 2>&1; then
          echo "FIREBASE_SERVICE_ACCOUNT_B64가 유효한 서비스 계정 JSON이 아니거나 private_key 필드가 비어 있습니다." >&2
          exit 1
        fi

    # 러너를 tailnet에 임시 노드(ephemeral)로 붙여 서버 SSH에 접근, job 종료 시 자동 로그아웃
    - name: Tailscale 접속
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
        oauth-secret: ${{ inputs.tailscale-oauth-secret }}
        tags: tag:ci
        ping: ${{ inputs.ec2-host }}

    - name: known_hosts 등록
      shell: bash
      env:
        EC2_KNOWN_HOSTS: ${{ inputs.ec2-known-hosts }}
      run: |
        mkdir -p ~/.ssh
        echo "$EC2_KNOWN_HOSTS" >> ~/.ssh/known_hosts

    - name: SSH 키 설정
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ec2-ssh-key }}

    - name: 배포 전 현재 compose/nginx/.env 설정 백업
      shell: bash
      env:
        EC2_USERNAME: ${{ inputs.ec2-username }}
        EC2_HOST: ${{ inputs.ec2-host }}
        EC2_APP_DIR: ${{ inputs.ec2-app-dir }}
        COMPOSE_FILE_NAME: docker-compose.yml
      run: |
        ssh "$EC2_USERNAME@$EC2_HOST" "EC2_APP_DIR='$EC2_APP_DIR' COMPOSE_FILE_NAME='$COMPOSE_FILE_NAME' bash -s" << 'EOF'
          set -euo pipefail
          cd "$EC2_APP_DIR"
          rm -rf .prev_release
          mkdir -p .prev_release
          [ -f "$COMPOSE_FILE_NAME" ] && cp "$COMPOSE_FILE_NAME" .prev_release/ || true
          [ -d nginx ] && cp -r nginx .prev_release/ || true
          [ -f .env ] && cp -p .env .prev_release/.env || true
        EOF

    - name: compose 파일 / nginx 설정 / 배포 스크립트 EC2로 복사
      shell: bash
      env:
        EC2_USERNAME: ${{ inputs.ec2-username }}
        EC2_HOST: ${{ inputs.ec2-host }}
        EC2_APP_DIR: ${{ inputs.ec2-app-dir }}
        COMPOSE_FILE_NAME: docker-compose.yml
      run: |
        scp -r "$COMPOSE_FILE_NAME" nginx deploy "$EC2_USERNAME@$EC2_HOST:$EC2_APP_DIR/"
