name: CD

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/halo-umc/halo-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - name: bootJar 빌드
        run: ./gradlew bootJar

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: known_hosts 등록
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: SSH 키 설정
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: docker-compose.yml / nginx 설정 EC2로 복사
        run: |
          scp -r docker-compose.yml nginx ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/

      - name: .env 생성 및 재배포
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ${{ secrets.EC2_APP_DIR }}

            install -m 600 /dev/null .env
            cat > .env << 'ENVEOF'
            DOMAIN=${{ secrets.DOMAIN }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PW=${{ secrets.DB_PW }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            S3_BUCKET_ACCESS_KEY=${{ secrets.S3_BUCKET_ACCESS_KEY }}
            S3_BUCKET_SECRET_KEY=${{ secrets.S3_BUCKET_SECRET_KEY }}
            ENVEOF

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose config >/dev/null

            # 롤백 대비, 교체되기 전 현재 실행 중인 이미지 ID 기록 (최초 배포면 빈 값)
            PREV_IMAGE_ID=$(docker inspect --format='{{.Image}}' halo-app 2>/dev/null || true)

            docker compose pull app certbot
            docker compose build nginx
            docker compose up -d --remove-orphans --force-recreate

            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "헬스체크 통과"
                docker image prune -f
                exit 0
              fi
              echo "헬스체크 대기 중... ($i/15)"
              sleep 4
            done

            echo "헬스체크 실패" >&2
            docker compose logs --tail=100 app

            if [ -z "$PREV_IMAGE_ID" ]; then
              echo "이전 이미지 정보 없음, 롤백 불가" >&2
              exit 1
            fi

            echo "이전 이미지로 롤백 시도" >&2
            docker tag "$PREV_IMAGE_ID" ${{ env.IMAGE_NAME }}:latest
            docker compose up -d --force-recreate app

            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "롤백 완료, 이전 버전으로 정상 기동"
                exit 1
              fi
              echo "롤백 헬스체크 대기 중... ($i/15)"
              sleep 4
            done

            echo "롤백도 실패" >&2
            docker compose logs --tail=100 app
            exit 1
          EOF