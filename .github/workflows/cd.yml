name: CD

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/halo-umc/halo-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: JDK 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: bootJar 빌드
        run: ./gradlew bootJar

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 현재 EC2(x86)와 이전 대상 OCI A1(ARM)을 모두 지원하도록 멀티아키 빌드, arm64는 QEMU 에뮬레이션
      - name: QEMU 설정
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    concurrency:
      group: deploy-prod-ec2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 배포 준비 (Firebase 검증 / Tailscale 접속 / SSH 설정 / compose 및 nginx 백업 및 전송)
        uses: ./.github/actions/deploy-bootstrap
        with:
          firebase-service-account-b64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ec2-known-hosts: ${{ secrets.EC2_KNOWN_HOSTS }}
          ec2-ssh-key: ${{ secrets.EC2_SSH_KEY }}
          ec2-username: ${{ secrets.EC2_USERNAME }}
          ec2-host: ${{ secrets.EC2_HOST }}
          ec2-app-dir: ${{ secrets.EC2_APP_DIR }}

      - name: .env 생성 및 재배포
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "GITHUB_ACTOR='$GITHUB_ACTOR' bash -s" << 'EOF'
            set -euo pipefail
            cd ${{ secrets.EC2_APP_DIR }}

            install -m 600 /dev/null .env
            cat > .env << 'ENVEOF'
          SPRING_PROFILES_ACTIVE=prod
          DOMAIN=${{ secrets.DOMAIN }}
          DB_URL=${{ secrets.DB_URL }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PW=${{ secrets.DB_PW }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          S3_KMS_KEY_ID=${{ secrets.S3_KMS_KEY_ID }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          FIREBASE_SERVICE_ACCOUNT_B64=${{secrets.FIREBASE_SERVICE_ACCOUNT_B64}}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          ENVEOF

            # build-and-push가 같은 워크플로우 실행 안에서 이미 push했으므로 별도 PAT 없이 pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # 배포/헬스체크/롤백 로직은 deploy-bootstrap이 함께 전송한 스크립트에서 수행
            IMAGE_TAG="${{ github.sha }}" bash deploy/deploy.sh
          EOF
