name: CD

on:
  push:
    branches: [ main, develop ]

concurrency:
  group: deploy-shared-ec2
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/halo-umc/halo-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: JDK 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: bootJar 빌드
        run: ./gradlew bootJar

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: known_hosts 등록
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: SSH 키 설정
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: 배포 전 현재 compose/nginx 설정 백업
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.EC2_APP_DIR }}
            rm -rf .prev_release
            mkdir -p .prev_release
            [ -f docker-compose.yml ] && cp docker-compose.yml .prev_release/ || true
            [ -d nginx ] && cp -r nginx .prev_release/ || true
          EOF

      - name: docker-compose.yml / nginx 설정 EC2로 복사
        run: |
          scp -r docker-compose.yml nginx ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/

      - name: .env 생성 및 재배포
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.EC2_APP_DIR }}

            install -m 600 /dev/null .env
            cat > .env << 'ENVEOF'
            SPRING_PROFILES_ACTIVE=prod
            DOMAIN=${{ secrets.DOMAIN }}
            DEV_DOMAIN=${{ secrets.DEV_DOMAIN }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PW=${{ secrets.DB_PW }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            S3_BUCKET_ACCESS_KEY=${{ secrets.S3_BUCKET_ACCESS_KEY }}
            S3_BUCKET_SECRET_KEY=${{ secrets.S3_BUCKET_SECRET_KEY }}
            ENVEOF

            # dev 서브도메인 접근 제한용 basic auth 계정 파일 (nginx가 참조)
            # 비밀번호를 CLI 인자로 넘기면 프로세스 목록에 노출될 수 있어 표준입력으로 전달
            install -m 600 /dev/null .htpasswd
            HTPASSWD_HASH=$(printf '%s' '${{ secrets.DEV_BASIC_AUTH_PASSWORD }}' | openssl passwd -apr1 -stdin)
            echo "${{ secrets.DEV_BASIC_AUTH_USER }}:$HTPASSWD_HASH" > .htpasswd

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 롤백 대비, 직전에 성공적으로 배포된 이미지의 SHA 태그 기록 (최초 배포면 빈 값)
            PREV_SHA=$(cat .deployed_sha 2>/dev/null || true)

            export IMAGE_TAG="${{ github.sha }}"
            docker compose config >/dev/null

            # elif 대신 개별 if: 앞 단계 실패 시 up을 건너뛰면 구버전이 헬스체크를 통과해 잘못된 SHA가 기록될 수 있음
            DEPLOY_OK=true
            if ! docker compose pull app certbot; then
              echo "이미지 pull 실패" >&2
              DEPLOY_OK=false
            fi
            if [ "$DEPLOY_OK" = true ] && ! docker compose build nginx; then
              echo "nginx 빌드 실패" >&2
              DEPLOY_OK=false
            fi
            if [ "$DEPLOY_OK" = true ] && ! docker compose up -d --remove-orphans --force-recreate app nginx certbot; then
              echo "compose up 실패" >&2
              DEPLOY_OK=false
            fi

            if [ "$DEPLOY_OK" = true ]; then
              for i in $(seq 1 15); do
                if curl -sf --max-time 5 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                  echo "헬스체크 통과"
                  echo "$IMAGE_TAG" > .deployed_sha
                  docker image prune -f || true
                  exit 0
                fi
                echo "헬스체크 대기 중... ($i/15)"
                sleep 4
              done
              echo "헬스체크 실패" >&2
            else
              echo "배포 명령 실패로 헬스체크 생략, 롤백 절차로 진행" >&2
            fi

            docker compose logs --tail=100 app || true

            if [ -z "$PREV_SHA" ]; then
              echo "이전 이미지 정보 없음, 롤백 불가" >&2
              exit 1
            fi

            echo "이전 이미지(SHA: $PREV_SHA)로 롤백 시도" >&2

            # app 이미지뿐 아니라 새로 배포된 compose/nginx 설정도 함께 되돌림
            cp .prev_release/docker-compose.yml docker-compose.yml
            rm -rf nginx
            cp -r .prev_release/nginx nginx

            export IMAGE_TAG="$PREV_SHA"
            docker compose config >/dev/null

            ROLLBACK_OK=true
            if ! docker compose pull app; then
              echo "롤백용 이미지 pull 실패" >&2
              ROLLBACK_OK=false
            fi
            if [ "$ROLLBACK_OK" = true ] && ! docker compose build nginx; then
              echo "롤백용 nginx 빌드 실패" >&2
              ROLLBACK_OK=false
            fi
            if [ "$ROLLBACK_OK" = true ] && ! docker compose up -d --force-recreate app nginx; then
              echo "롤백용 compose up 실패" >&2
              ROLLBACK_OK=false
            fi

            if [ "$ROLLBACK_OK" = true ]; then
              for i in $(seq 1 15); do
                if curl -sf --max-time 5 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"' \
                  && [ "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = "301" ]; then
                  echo "롤백 완료, 이전 버전으로 정상 기동"
                  exit 1
                fi
                echo "롤백 헬스체크 대기 중... ($i/15)"
                sleep 4
              done
            fi

            echo "롤백도 실패" >&2
            docker compose logs --tail=100 app nginx || true
            exit 1
          EOF

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: known_hosts 등록
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: SSH 키 설정
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: docker-compose.yml / nginx 설정 EC2로 복사
        run: |
          scp -r docker-compose.yml nginx ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/

      - name: .env.dev 생성 및 dev 재배포
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.EC2_APP_DIR }}

            install -m 600 /dev/null .env.dev
            cat > .env.dev << 'ENVEOF'
            SPRING_PROFILES_ACTIVE=dev
            DB_URL=${{ secrets.DEV_DB_URL }}
            DB_USER=${{ secrets.DEV_DB_USER }}
            DB_PW=${{ secrets.DEV_DB_PW }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            S3_BUCKET_NAME=${{ secrets.DEV_S3_BUCKET_NAME }}
            S3_BUCKET_ACCESS_KEY=${{ secrets.S3_BUCKET_ACCESS_KEY }}
            S3_BUCKET_SECRET_KEY=${{ secrets.S3_BUCKET_SECRET_KEY }}
            ENVEOF

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export DEV_IMAGE_TAG="${{ github.sha }}"
            docker compose config >/dev/null

            docker compose pull dev-app
            docker compose up -d --force-recreate dev-app

            for i in $(seq 1 15); do
              if docker compose exec -T dev-app curl -sf --max-time 5 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "dev 헬스체크 통과"
                docker image prune -f || true
                exit 0
              fi
              echo "dev 헬스체크 대기 중... ($i/15)"
              sleep 4
            done

            echo "dev 헬스체크 실패" >&2
            docker compose logs --tail=100 dev-app || true
            exit 1
          EOF
