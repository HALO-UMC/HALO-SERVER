name: CD

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/halo-umc/halo-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: JDK 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: bootJar 빌드
        run: ./gradlew bootJar

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    concurrency:
      group: deploy-prod-ec2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 배포 준비 (Firebase 검증 / AWS 인증 / 러너 IP 허용 / SSH 설정 / compose 및 nginx 백업 및 전송)
        id: bootstrap
        uses: ./.github/actions/deploy-bootstrap
        with:
          firebase-service-account-b64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          ec2-security-group-id: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          ec2-known-hosts: ${{ secrets.EC2_KNOWN_HOSTS }}
          ec2-ssh-key: ${{ secrets.EC2_SSH_KEY }}
          ec2-username: ${{ secrets.EC2_USERNAME }}
          ec2-host: ${{ secrets.EC2_HOST }}
          ec2-app-dir: ${{ secrets.EC2_APP_DIR }}

      - name: .env 생성 및 재배포
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "GITHUB_ACTOR='$GITHUB_ACTOR' bash -s" << 'EOF'
            set -euo pipefail
            cd ${{ secrets.EC2_APP_DIR }}

            install -m 600 /dev/null .env
            cat > .env << 'ENVEOF'
          SPRING_PROFILES_ACTIVE=prod
          DOMAIN=${{ secrets.DOMAIN }}
          DB_URL=${{ secrets.DB_URL }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PW=${{ secrets.DB_PW }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          S3_KMS_KEY_ID=${{ secrets.S3_KMS_KEY_ID }}
          FIREBASE_SERVICE_ACCOUNT_B64=${{secrets.FIREBASE_SERVICE_ACCOUNT_B64}}
          ENVEOF

            # build-and-push가 같은 워크플로우 실행 안에서 이미 push했으므로 별도 PAT 없이 pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # 롤백 대비, 직전에 성공적으로 배포된 이미지의 SHA 태그 기록 (최초 배포면 빈 값)
            PREV_SHA=$(cat .deployed_sha 2>/dev/null || true)

            export IMAGE_TAG="${{ github.sha }}"
            docker compose config >/dev/null

            # elif 대신 개별 if: 앞 단계 실패 시 up을 건너뛰면 구버전이 헬스체크를 통과해 잘못된 SHA가 기록될 수 있음
            DEPLOY_OK=true
            if ! docker compose pull app certbot; then
              echo "이미지 pull 실패" >&2
              DEPLOY_OK=false
            fi
            if [ "$DEPLOY_OK" = true ] && ! docker compose build nginx; then
              echo "nginx 빌드 실패" >&2
              DEPLOY_OK=false
            fi
            if [ "$DEPLOY_OK" = true ] && ! docker compose up -d --force-recreate app certbot; then
              echo "compose up 실패" >&2
              DEPLOY_OK=false
            fi

            if [ "$DEPLOY_OK" = true ]; then
              APP_HEALTHY=false
              for i in $(seq 1 15); do
                if curl -sf --max-time 5 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                  echo "app 헬스체크 통과"
                  APP_HEALTHY=true
                  break
                fi
                echo "app 헬스체크 대기 중... ($i/15)"
                sleep 4
              done
              if [ "$APP_HEALTHY" != true ]; then
                echo "app 헬스체크 실패" >&2
                DEPLOY_OK=false
              fi
            else
              echo "배포 명령 실패로 헬스체크 생략, 롤백 절차로 진행" >&2
            fi

            # nginx 이미지가 바뀐 경우에만 재생성
            # 그 외엔 기존 컨테이너를 두고 reload.sh로 설정만 재로드
            if [ "$DEPLOY_OK" = true ] && ! docker compose up -d nginx; then
              echo "nginx 기동 실패" >&2
              DEPLOY_OK=false
            fi
            if [ "$DEPLOY_OK" = true ] && ! docker compose exec -T nginx /usr/local/bin/reload.sh; then
              echo "nginx 설정 재로드 실패" >&2
              DEPLOY_OK=false
            fi

            if [ "$DEPLOY_OK" = true ]; then
              echo "$IMAGE_TAG" > .deployed_sha
              docker image prune -f || true
              exit 0
            fi

            docker compose logs --tail=100 app || true

            if [ -z "$PREV_SHA" ]; then
              echo "이전 이미지 정보 없음, 롤백 불가" >&2
              exit 1
            fi

            if [ ! -f .prev_release/.env ]; then
              echo "이전 .env 스냅샷 없음, 롤백 불가" >&2
              exit 1
            fi

            echo "이전 이미지(SHA: $PREV_SHA)로 롤백 시도" >&2

            # app 이미지뿐 아니라 새로 배포된 compose/nginx/.env 설정도 함께 되돌림
            cp .prev_release/docker-compose.yml docker-compose.yml
            rm -rf nginx
            cp -r .prev_release/nginx nginx
            cp -p .prev_release/.env .env

            export IMAGE_TAG="$PREV_SHA"
            docker compose config >/dev/null

            ROLLBACK_OK=true
            if ! docker compose pull app; then
              echo "롤백용 이미지 pull 실패" >&2
              ROLLBACK_OK=false
            fi
            if [ "$ROLLBACK_OK" = true ] && ! docker compose build nginx; then
              echo "롤백용 nginx 빌드 실패" >&2
              ROLLBACK_OK=false
            fi
            # app을 먼저 확실히 되돌린 뒤에만 nginx를 재생성
            if [ "$ROLLBACK_OK" = true ] && ! docker compose up -d --force-recreate app; then
              echo "롤백용 compose up 실패" >&2
              ROLLBACK_OK=false
            fi

            if [ "$ROLLBACK_OK" = true ]; then
              ROLLBACK_APP_HEALTHY=false
              for i in $(seq 1 15); do
                if curl -sf --max-time 5 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                  ROLLBACK_APP_HEALTHY=true
                  break
                fi
                echo "롤백 app 헬스체크 대기 중... ($i/15)"
                sleep 4
              done
              [ "$ROLLBACK_APP_HEALTHY" = true ] || ROLLBACK_OK=false
            fi

            if [ "$ROLLBACK_OK" = true ] && ! docker compose up -d --force-recreate nginx; then
              echo "롤백용 nginx 재생성 실패" >&2
              ROLLBACK_OK=false
            fi

            if [ "$ROLLBACK_OK" = true ]; then
              for i in $(seq 1 15); do
                if curl -sf --max-time 5 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"' \
                  && [ "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = "301" ]; then
                  echo "롤백 완료, 이전 버전으로 정상 기동"
                  exit 1
                fi
                echo "롤백 헬스체크 대기 중... ($i/15)"
                sleep 4
              done
            fi

            echo "롤백도 실패" >&2
            docker compose logs --tail=100 app nginx || true
            exit 1
          EOF

      - name: 보안그룹에서 러너 IP 제거
        if: always() && steps.bootstrap.outputs.rule-id != ''
        uses: ./.github/actions/release-runner-ip
        with:
          rule-id: ${{ steps.bootstrap.outputs.rule-id }}
          ec2-security-group-id: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          env-label: prod
          discord-webhook-url: ${{ secrets.CD_ALERTS_DISCORD_WEBHOOK_URL }}
