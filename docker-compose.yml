services:
  app:
    build: .
    image: ghcr.io/halo-umc/halo-server:${IMAGE_TAG:-latest}
    pull_policy: always
    profiles: [ "prod" ]
    container_name: halo-app
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

  dev-app:
    build: .
    image: ghcr.io/halo-umc/halo-server:${DEV_IMAGE_TAG:-latest}
    pull_policy: always
    profiles: [ "dev" ]
    container_name: halo-dev-app
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    mem_limit: 1024m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env.dev
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

  nginx:
    build: ./nginx
    container_name: halo-nginx
    restart: unless-stopped
    # app/dev-app은 각각 prod/dev 프로필이라 nginx가 depends_on으로 물면
    # 배포 대상이 아닌 프로필까지 강제로 함께 기동됨
    # 대신 nginx 자체 진입점(watch-and-reload.sh)이 기동 시 없는 쪽의 server 블록을
    # 자체적으로 제외하고 뜨므로 depends_on 없이도 안전
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN is required}
      - DEV_DOMAIN=${DEV_DOMAIN:?DEV_DOMAIN is required}
    volumes:
      - ./nginx/fragments:/etc/nginx/fragments:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    networks:
      - internal

  certbot:
    image: certbot/certbot
    container_name: halo-certbot
    restart: unless-stopped
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

networks:
  internal:

volumes:
  certbot-webroot:
  certbot-certs:
